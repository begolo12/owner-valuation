    <script>
      // Build Flutter web lama meninggalkan service worker yang menyajikan
      // index.html usang (menunjuk main.dart.js yang sudah dihapus) → layar putih.
      // Cabut registrasi + cache lama sekali, lalu muat ulang bersih.
      (function () {
        if (!('serviceWorker' in navigator) && !window.caches) return;
        var reloaded = sessionStorage.getItem('ov.sw-clean');
        Promise.all([
          navigator.serviceWorker
            ? navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              })
            : Promise.resolve(),
          window.caches
            ? caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              })
            : Promise.resolve(),
        ]).then(function (out) {
          var removed = (out[0] || []).some(Boolean) || (out[1] || []).some(Boolean);
          if (removed && !reloaded) {
            sessionStorage.setItem('ov.sw-clean', '1');
            location.reload();
          }
        });
      })();
    </script>
