<!DOCTYPE html>
<html lang="id">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Penilaian owner baru & existing per kuartal">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Penilaian Owner">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Penilaian Owner</title>
  <link rel="manifest" href="manifest.json">

  <!-- Engine diambil dari origin sendiri, bukan gstatic: satu round trip lebih
       sedikit dan ikut cache CDN Vercel. -->
  <link rel="preconnect" href="/">

  <style>
    html, body { margin: 0; height: 100%; background: #0c0a09; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fafaf9;
    }
    #splash .bar {
      width: 132px; height: 3px; border-radius: 2px;
      background: #292524; overflow: hidden;
    }
    #splash .bar i {
      display: block; width: 40%; height: 100%; border-radius: 2px;
      background: #f59e0b; animation: slide 1s ease-in-out infinite;
    }
    #splash p { margin: 0; font-size: 13px; letter-spacing: .04em; color: #a8a29e; }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    body.ready #splash { display: none; }
  </style>
</head>
<body>
  <div id="splash">
    <div class="bar"><i></i></div>
    <p>PENILAIAN OWNER</p>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.body.classList.add('ready');
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
